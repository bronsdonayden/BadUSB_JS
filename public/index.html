<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BadUSB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="desktop"></div>
  <div id="taskbar"></div>

  <div id="explorer" class="hidden">
    <div id="explorer-titlebar">
      <button id="explorer-back">&#8592;</button>
      <span id="explorer-title">File Explorer</span>
      <button id="explorer-close">&times;</button>
    </div>
    <div id="explorer-content"></div>
  </div>

  <div id="image-viewer" class="hidden">
    <div id="viewer-titlebar">
      <span id="viewer-title">Image Viewer</span>
      <button id="viewer-close">&times;</button>
    </div>
    <div id="viewer-content">
      <img id="viewer-img" src="" alt="">
    </div>
  </div>

  <div id="text-viewer" class="hidden">
    <div id="text-viewer-titlebar">
      <span id="text-viewer-title">Notepad</span>
      <button id="text-viewer-close">&times;</button>
    </div>
    <textarea id="text-viewer-content"></textarea>
  </div>

  <script src="app.js"></script>
</body>
</html>
