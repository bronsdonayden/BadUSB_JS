<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input {
      padding: 8px;
      font-size: 14px;
      background: #2d2d2d;
      border: 1px solid #444;
      color: white;
    }
    button {
      padding: 8px;
      background: #0078d4;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form method="POST" action="/login" autocomplete="off">
    <input type="password" name="password" placeholder="Password"  autocomplete="off" style="-webkit-text-security: disc;">
    <button type="submit">Login</button>
  </form>
</body>
</html>
